<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 192 192" width="192" height="192">
  <title>DigiÉire</title>
  <!-- The leaf from the DigiÉire wordmark, lifted from the logo artwork itself
       rather than redrawn, so the tab mark and the header mark cannot drift
       apart. The whole wordmark is illegible at 16 px; the leaf is the one
       element of the mark that still reads at that size, and its white midrib
       survives as a light stroke down to 16 px.

       A RASTER INSIDE AN SVG, embedded as a data URI. The artwork is a smooth
       green gradient, so tracing it to paths would approximate the mark rather
       than reproduce it. Quantised to 256 colours (the PNG8 maximum, and
       invisible on a single hue), which takes the file from 34 KiB to about 7.
       One self-contained file that loads identically from file:// and from a
       web server, so the link rel="icon" in the page is unchanged.

       ONE REFERENCE, xlink:href. Carrying both the SVG 1.1 xlink:href and the
       SVG 2 href would embed the base64 payload twice and double the file for
       nothing: every engine that renders SVG favicons still honours xlink.

       NO DOUBLE HYPHEN IN THIS COMMENT. SVG is XML, so a double hyphen inside
       a comment is a fatal parse error and the icon renders as nothing at all.
       An earlier draft of this file had several and was caught by running an
       XML parser over every SVG in this directory.

       Replaces the earlier placeholder: a gradient tile with a sun and two
       waves, drawn before there was a logo and matching nothing once there
       was. -->
  <image x="0" y="0" width="192" height="192" xlink:href="data:image/png;base64,"/>
</svg>
