<text x="60" y="1008" font-family="Arial" font-size="24" fill="#123e33" text-anchor="start">Language-model scores are indicators derived from public discourse.</text>
<text x="60" y="1045" font-family="Arial" font-size="20" fill="#566b65" text-anchor="start">The diagram explains the calculation; it does not show a measured example or a population-wide survey estimate.</text>
