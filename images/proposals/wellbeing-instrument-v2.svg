<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc"><title id="title">Measuring wellbeing from public discourse</title><desc id="desc">Language models score distress, functional disruption and alienation from zero to three. Each construct is standardised against a reference sample. The index is one divided by one plus the exponential of sensitivity times the sum of the three standardised scores.</desc>
<rect x="0" y="0" width="1800" height="1100" rx="0" fill="#fbfaf7"/>
<text x="60" y="62" font-family="Arial" font-size="22" fill="#1a7a5e" text-anchor="start">DigiÉire · Wellbeing measurement</text>
<text x="60" y="123" font-family="Arial" font-size="46" fill="#123e33" text-anchor="start">From public discourse to a wellbeing index</text>
<text x="60" y="168" font-family="Arial" font-size="26" fill="#566b65" text-anchor="start">Three constructs, a common scale, one measure</text>
<text x="60" y="234" font-family="Arial" font-size="19" fill="#1a7a5e" text-anchor="start">01  EXTRACT</text>
<rect x="60" y="266" width="500" height="650" rx="18" fill="#fff"/>
<rect x="60" y="266" width="500" height="5" rx="0" fill="#1a7a5e"/>
<text x="650" y="234" font-family="Arial" font-size="19" fill="#1a7a5e" text-anchor="start">02  STANDARDISE AND COMBINE</text>
<rect x="650" y="266" width="500" height="650" rx="18" fill="#fff"/>
<rect x="650" y="266" width="500" height="5" rx="0" fill="#1a7a5e"/>
<text x="1240" y="234" font-family="Arial" font-size="19" fill="#1a7a5e" text-anchor="start">03  INTERPRET</text>
<rect x="1240" y="266" width="500" height="650" rx="18" fill="#fff"/>
<rect x="1240" y="266" width="500" height="5" rx="0" fill="#1a7a5e"/>
<rect x="585" y="563" width="23" height="4" rx="0" fill="#566b65"/>
<polygon points="607,557 620,565 607,573" fill="#566b65"/>
<rect x="1175" y="563" width="23" height="4" rx="0" fill="#566b65"/>
<polygon points="1197,557 1210,565 1197,573" fill="#566b65"/>
<text x="88" y="320" font-family="Arial" font-size="30" fill="#123e33" text-anchor="start">Language-model analysis</text>
<text x="88" y="364" font-family="Arial" font-size="23" fill="#566b65" text-anchor="start">A public post or comment is scored</text>
<text x="88" y="398" font-family="Arial" font-size="23" fill="#566b65" text-anchor="start">on three wellbeing constructs.</text>
<rect x="88" y="431" width="444" height="111" rx="10" fill="#f4f7f5"/>
<rect x="88" y="431" width="4" height="111" rx="0" fill="#a7624a"/>
<text x="108" y="468" font-family="Arial" font-size="27" fill="#123e33" text-anchor="start">I1  Distress</text>
<text x="108" y="501" font-family="Arial" font-size="20" fill="#566b65" text-anchor="start">Worry, dread and exhaustion</text>
<text x="108" y="527" font-family="Arial" font-size="18" fill="#a7624a" text-anchor="start">Score: 0–3</text>
<rect x="88" y="568" width="444" height="111" rx="10" fill="#f4f7f5"/>
<rect x="88" y="568" width="4" height="111" rx="0" fill="#2874a6"/>
<text x="108" y="605" font-family="Arial" font-size="27" fill="#123e33" text-anchor="start">I2  Functional disruption</text>
<text x="108" y="638" font-family="Arial" font-size="20" fill="#566b65" text-anchor="start">Housing, income, services and mobility</text>
<text x="108" y="664" font-family="Arial" font-size="18" fill="#2874a6" text-anchor="start">Score: 0–3</text>
<rect x="88" y="705" width="444" height="111" rx="10" fill="#f4f7f5"/>
<rect x="88" y="705" width="4" height="111" rx="0" fill="#1a7a5e"/>
<text x="108" y="742" font-family="Arial" font-size="27" fill="#123e33" text-anchor="start">I3  Alienation</text>
<text x="108" y="775" font-family="Arial" font-size="20" fill="#566b65" text-anchor="start">Feeling unheard, dismissed or failed</text>
<text x="108" y="801" font-family="Arial" font-size="18" fill="#1a7a5e" text-anchor="start">Score: 0–3</text>
<text x="88" y="868" font-family="Arial" font-size="22" fill="#566b65" text-anchor="start">Scores describe evidence in the text.</text>
<text x="678" y="320" font-family="Arial" font-size="25" fill="#123e33" text-anchor="start">Put each construct on a common scale</text>
<text x="720" y="409" font-family="Georgia" font-size="38" fill="#123e33" text-anchor="start">z</text>
<text x="740.9" y="417" font-family="Georgia" font-size="21.28" fill="#123e33" text-anchor="start">i</text>
<text x="764" y="409" font-family="Georgia" font-size="36" fill="#123e33" text-anchor="start">=</text>
<text x="822" y="387" font-family="Georgia" font-size="36" fill="#123e33" text-anchor="start">x</text>
<text x="841.8" y="395" font-family="Georgia" font-size="20.160000000000004" fill="#123e33" text-anchor="start">i</text>
<text x="866" y="387" font-family="Georgia" font-size="36" fill="#123e33" text-anchor="start">−</text>
<text x="907" y="387" font-family="Georgia" font-size="36" fill="#123e33" text-anchor="start">μ</text>
<text x="926.8" y="395" font-family="Georgia" font-size="20.160000000000004" fill="#123e33" text-anchor="start">i</text>
<rect x="809" y="402" width="154" height="2" rx="0" fill="#123e33"/>
<text x="866" y="443" font-family="Georgia" font-size="36" fill="#123e33" text-anchor="start">σ</text>
<text x="885.8" y="451" font-family="Georgia" font-size="20.160000000000004" fill="#123e33" text-anchor="start">i</text>
<text x="678" y="499" font-family="Arial" font-size="21" fill="#566b65" text-anchor="start">x: construct score · μ: reference mean</text>
<text x="678" y="530" font-family="Arial" font-size="21" fill="#566b65" text-anchor="start">σ: reference standard deviation</text>
<text x="678" y="561" font-family="Arial" font-size="21" fill="#566b65" text-anchor="start">i = 1, 2, 3</text>
<rect x="678" y="589" width="444" height="1" rx="0" fill="#dce5df"/>
<text x="678" y="633" font-family="Arial" font-size="28" fill="#123e33" text-anchor="start">Combine into one index</text>
<text x="681" y="722" font-family="Georgia" font-size="32" fill="#123e33" text-anchor="start">W =</text>
<text x="929" y="690" font-family="Georgia" font-size="35" fill="#123e33" text-anchor="middle">1</text>
<rect x="769" y="704" width="348" height="2" rx="0" fill="#123e33"/>
<text x="778" y="752" font-family="Georgia" font-size="25" fill="#123e33" text-anchor="start">1 + exp[α(</text>
<text x="908" y="752" font-family="Georgia" font-size="27" fill="#123e33" text-anchor="start">z</text>
<text x="922.85" y="760" font-family="Georgia" font-size="15.120000000000001" fill="#123e33" text-anchor="start">1</text>
<text x="939" y="752" font-family="Georgia" font-size="25" fill="#123e33" text-anchor="start">+</text>
<text x="965" y="752" font-family="Georgia" font-size="27" fill="#123e33" text-anchor="start">z</text>
<text x="979.85" y="760" font-family="Georgia" font-size="15.120000000000001" fill="#123e33" text-anchor="start">2</text>
<text x="996" y="752" font-family="Georgia" font-size="25" fill="#123e33" text-anchor="start">+</text>
<text x="1022" y="752" font-family="Georgia" font-size="27" fill="#123e33" text-anchor="start">z</text>
<text x="1036.85" y="760" font-family="Georgia" font-size="15.120000000000001" fill="#123e33" text-anchor="start">3</text>
<text x="1054" y="752" font-family="Georgia" font-size="25" fill="#123e33" text-anchor="start">)]</text>
<text x="678" y="809" font-family="Arial" font-size="21" fill="#566b65" text-anchor="start">α controls the index’s sensitivity.</text>
<text x="678" y="841" font-family="Arial" font-size="21" fill="#566b65" text-anchor="start">The reference sample supplies μ and σ.</text>
<text x="678" y="890" font-family="Arial" font-size="18" fill="#566b65" text-anchor="start">Calculation follows the analysis application.</text>
<text x="1268" y="320" font-family="Arial" font-size="32" fill="#123e33" text-anchor="start">Overall wellbeing</text>
<text x="1268" y="367" font-family="Arial" font-size="25" fill="#566b65" text-anchor="start">One index for each discourse,</text>
<text x="1268" y="401" font-family="Arial" font-size="25" fill="#566b65" text-anchor="start">on a scale from 0 to 1.</text>
