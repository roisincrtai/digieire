<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc"><title id="title">DigiÉire: from public discourse to future wellbeing</title><desc id="desc">Public discourse in Ireland is analysed using language models to extract wellbeing indicators. These indicators and historical rainfall and flood records inform a flood-wellbeing model. That model informs agent-based simulations to 2100, driven by RCP climate pathways and adaptation choices, to compare projected wellbeing outcomes.</desc>
