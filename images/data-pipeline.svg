<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 380" width="1160" height="380"
     role="img" aria-labelledby="dp-t dp-d">
  <title id="dp-t">From annotation to the browser, and what is withheld</title>
  <desc id="dp-d">Annotated examples train a scoring model; the model scores the
    discourse corpus on the research machine; only dates, construct scores and a
    coarse location are exported as JSON shards; the browser application reads
    them with no server. Text, identifiers, authors, reaction counts and clock
    times stay behind.</desc>

  <defs>
    <style>
      .h { font: 700 13px -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #0b3b2e; }
      .n { font: 400 11px -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #35443f; }
      .s { font: 600 10px 'SFMono-Regular', Menlo, monospace; fill: #66756f;
           letter-spacing: .12em; text-transform: uppercase; }
      .m { font: 400 10.5px 'SFMono-Regular', Menlo, monospace; fill: #14211d; }
      .box { fill: #fff; stroke: #dfe3e0; }
    </style>
    <marker id="dp-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#66756f"/>
    </marker>
  </defs>

  <rect width="1160" height="380" fill="#fbfaf7"/>

  <!-- the research side -->
  <rect x="24" y="40" width="640" height="212" rx="12" fill="#e4f2ec" opacity=".5"/>
  <text class="s" x="42" y="64">On the research machine</text>

  <!-- the published side -->
  <rect x="692" y="40" width="444" height="212" rx="12" fill="#e8f1f7" opacity=".6"/>
  <text class="s" x="710" y="64">Published — anyone can hold this</text>

  <!-- 1 annotation -->
  <g transform="translate(44,84)">
    <rect class="box" x="0" y="0" width="176" height="146" rx="9"/>
    <text class="h" x="16" y="26">Expert annotation</text>
    <g transform="translate(16,40)">
      <g fill="#e4f2ec">
        <rect x="0" y="0"  width="140" height="6" rx="3"/>
        <rect x="0" y="14" width="112" height="6" rx="3"/>
        <rect x="0" y="28" width="128" height="6" rx="3"/>
      </g>
      <!-- cue words: the evidence an annotator marked -->
      <rect x="30" y="-2"  width="34" height="10" rx="3" fill="#f6dfba"/>
      <rect x="76" y="12"  width="28" height="10" rx="3" fill="#f6dfba"/>
      <rect x="14" y="26"  width="40" height="10" rx="3" fill="#f6dfba"/>
    </g>
    <text class="n" x="16" y="106">scores 0–3 per construct,</text>
    <text class="n" x="16" y="120">plus the words that justify them</text>
    <text class="n" x="16" y="136" fill="#8a5313">highlighted = evidence</text>
  </g>

  <!-- 2 model -->
  <g transform="translate(256,84)">
    <rect class="box" x="0" y="0" width="176" height="146" rx="9"/>
    <text class="h" x="16" y="26">Scoring model</text>
    <g transform="translate(24,44)" stroke="#1a7a5e" stroke-opacity=".45" fill="#1a7a5e">
      <g fill="#cfe0d6">
        <circle cx="0"  cy="10" r="5"/><circle cx="0"  cy="34" r="5"/>
        <circle cx="0"  cy="58" r="5"/>
        <circle cx="60" cy="4"  r="5"/><circle cx="60" cy="28" r="5"/>
        <circle cx="60" cy="52" r="5"/><circle cx="60" cy="76" r="5"/>
        <circle cx="120" cy="16" r="5"/><circle cx="120" cy="46" r="5"/>
      </g>
      <g stroke-width="1">
        <line x1="5" y1="10" x2="55" y2="4"/><line x1="5" y1="10" x2="55" y2="28"/>
        <line x1="5" y1="34" x2="55" y2="28"/><line x1="5" y1="34" x2="55" y2="52"/>
        <line x1="5" y1="58" x2="55" y2="52"/><line x1="5" y1="58" x2="55" y2="76"/>
        <line x1="65" y1="4"  x2="115" y2="16"/><line x1="65" y1="28" x2="115" y2="16"/>
        <line x1="65" y1="52" x2="115" y2="46"/><line x1="65" y1="76" x2="115" y2="46"/>
      </g>
    </g>
    <text class="n" x="16" y="136">a transformer over a frozen encoder</text>
  </g>

  <!-- 3 corpus scored -->
  <g transform="translate(468,84)">
    <rect class="box" x="0" y="0" width="176" height="146" rx="9"/>
    <text class="h" x="16" y="26">Scored corpus</text>
    <text class="m" x="16" y="52" font-size="20" fill="#0f4c3a">90,567</text>
    <text class="n" x="16" y="70">discourses, 2010–2026</text>
    <line x1="16" y1="84" x2="160" y2="84" stroke="#dfe3e0"/>
    <text class="n" x="16" y="104" fill="#66756f">holds text, identifiers,</text>
    <text class="n" x="16" y="118" fill="#66756f">timestamps, reaction counts</text>
    <text class="n" x="16" y="136" fill="#c0392b">never leaves this machine</text>
  </g>

  <!-- the gate -->
  <g transform="translate(664,84)">
    <rect x="0" y="0" width="28" height="146" rx="6" fill="#0f4c3a" opacity=".08"/>
    <g stroke="#0f4c3a" stroke-width="1.6" fill="none" opacity=".55">
      <path d="M14 20 v106"/>
    </g>
    <g transform="translate(14,73)">
      <circle r="12" fill="#fff" stroke="#0f4c3a"/>
      <path d="M-4 0 v-4 a4 4 0 0 1 8 0 v4" fill="none" stroke="#0f4c3a"
            stroke-width="1.6"/>
      <rect x="-5" y="0" width="10" height="8" rx="1.6" fill="#0f4c3a"/>
    </g>
  </g>

  <!-- 4 export -->
  <g transform="translate(712,84)">
    <rect class="box" x="0" y="0" width="196" height="146" rx="9"/>
    <text class="h" x="16" y="26">Export — scores only</text>
    <rect x="16" y="38" width="164" height="30" rx="6" fill="#eef4f8"/>
    <text class="m" x="26" y="58">[day, I1, I2, I3, loc]</text>
    <text class="n" x="16" y="88">21 JSON shards, ~64 KB each</text>
    <text class="n" x="16" y="104">1.4 MB in total</text>
    <line x1="16" y1="114" x2="180" y2="114" stroke="#dfe3e0"/>
    <text class="n" x="16" y="132" fill="#c0392b">no text · no ids · no authors</text>
    <text class="n" x="16" y="146" fill="#c0392b">no reactions · no clock times</text>
  </g>

  <!-- 5 browser -->
  <g transform="translate(936,84)">
    <rect class="box" x="0" y="0" width="180" height="146" rx="9"/>
    <text class="h" x="16" y="26">Your browser</text>
    <g transform="translate(16,38)">
      <rect x="0" y="0" width="148" height="76" rx="6" fill="#fbfaf7"
            stroke="#dfe3e0"/>
      <rect x="0" y="0" width="148" height="14" rx="6" fill="#eef2f0"/>
      <circle cx="10" cy="7" r="2.4" fill="#cfd8d4"/>
      <circle cx="19" cy="7" r="2.4" fill="#cfd8d4"/>
      <polyline points="10,62 30,48 48,54 68,32 88,40 108,22 132,30"
                fill="none" stroke="#16a085" stroke-width="2"/>
      <polyline points="10,68 30,60 48,64 68,52 88,58 108,46 132,50"
                fill="none" stroke="#2874a6" stroke-width="1.4"
                stroke-dasharray="3 3"/>
    </g>
    <text class="n" x="16" y="132">binning, standardising and the</text>
    <text class="n" x="16" y="146">statistics all run here — no server</text>
  </g>

  <!-- arrows -->
  <g fill="none" stroke="#66756f" stroke-width="1.5" marker-end="url(#dp-a)">
    <line x1="224" y1="157" x2="252" y2="157"/>
    <line x1="436" y1="157" x2="464" y2="157"/>
    <line x1="648" y1="157" x2="660" y2="157"/>
    <line x1="696" y1="157" x2="708" y2="157"/>
    <line x1="912" y1="157" x2="932" y2="157"/>
  </g>

  <!-- the claim under it all -->
  <g transform="translate(44,286)">
    <rect x="0" y="0" width="1072" height="62" rx="9" fill="#fff"
          stroke="#dfe3e0"/>
    <text class="h" x="20" y="26">Checked, not asserted</text>
    <text class="n" x="20" y="46">
      Every published figure is compared against the research implementation
      before release: the same settings are run through both, and all
      24 payloads must agree to one part in a billion. The export's
      re-identification risk is re-measured on every build.
    </text>
  </g>
</svg>
