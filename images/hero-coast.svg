<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 520" width="1440" height="520"
     role="img" aria-labelledby="hc-title hc-desc" preserveAspectRatio="xMidYMid slice">
  <title id="hc-title">An Irish coastal catchment under rainfall</title>
  <desc id="hc-desc">A stylised cross-section from Atlantic uplands down through a
    river valley to a coastal town and the sea, with rain falling over the
    catchment and the floodplain picked out along the river.</desc>

  <defs>
    <linearGradient id="hc-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#dbe7ef"/>
      <stop offset="55%" stop-color="#eaf0f3"/>
      <stop offset="100%" stop-color="#f4f2ed"/>
    </linearGradient>
    <linearGradient id="hc-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fa8a0"/><stop offset="100%" stop-color="#aebdb5"/>
    </linearGradient>
    <linearGradient id="hc-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4f8a72"/><stop offset="100%" stop-color="#6ea187"/>
    </linearGradient>
    <linearGradient id="hc-near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a7a5e"/><stop offset="100%" stop-color="#12604a"/>
    </linearGradient>
    <linearGradient id="hc-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2874a6"/><stop offset="100%" stop-color="#17456b"/>
    </linearGradient>
    <linearGradient id="hc-river" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8fc1de"/><stop offset="100%" stop-color="#2874a6"/>
    </linearGradient>
    <linearGradient id="hc-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfaf7" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fbfaf7" stop-opacity=".92"/>
    </linearGradient>
    <!-- Rain: one tilted stroke, tiled. Drawn as a pattern rather than as a few
         hundred lines so the file stays small and the density stays even. -->
    <pattern id="hc-rain" width="26" height="46" patternUnits="userSpaceOnUse"
             patternTransform="rotate(14)">
      <line x1="4" y1="0" x2="4" y2="17" stroke="#2874a6" stroke-opacity=".30"
            stroke-width="1.3" stroke-linecap="round"/>
      <line x1="17" y1="23" x2="17" y2="38" stroke="#2874a6" stroke-opacity=".18"
            stroke-width="1.1" stroke-linecap="round"/>
    </pattern>
  </defs>

  <rect width="1440" height="520" fill="url(#hc-sky)"/>

  <!-- weather: a frontal band coming in off the Atlantic, left to right -->
  <g opacity=".8">
    <ellipse cx="240" cy="96"  rx="215" ry="52" fill="#c9d6de"/>
    <ellipse cx="430" cy="80"  rx="180" ry="44" fill="#d6e0e6"/>
    <ellipse cx="120" cy="120" rx="150" ry="40" fill="#bccbd4"/>
    <ellipse cx="700" cy="70"  rx="150" ry="34" fill="#dfe7ea"/>
  </g>
  <rect x="0" y="118" width="820" height="250" fill="url(#hc-rain)"/>

  <!-- far uplands -->
  <path fill="url(#hc-far)" d="M0 300 L90 236 L150 268 L232 200 L300 250 L372 206
        L448 262 L520 232 L610 286 L700 250 L790 300 L880 268 L980 306 L1080 280
        L1200 316 L1320 292 L1440 322 L1440 520 L0 520 Z"/>

  <!-- middle hills, with the valley the river runs down -->
  <path fill="url(#hc-mid)" d="M0 360 L120 322 L226 356 L318 312 L410 352 L500 330
        L590 372 L676 344 L764 386 L860 356 L960 392 L1070 368 L1180 400 L1300 380
        L1440 404 L1440 520 L0 520 Z"/>

  <!-- the floodplain: the flat ground either side of the river, the ground that
       actually floods. Deliberately paler than the hills so it reads as a
       distinct surface rather than as more hillside. -->
  <path fill="#cfe0d6" d="M470 470 C560 430 640 424 720 430 C820 438 900 452 1000 448
        C1120 444 1230 452 1440 446 L1440 520 L470 520 Z"/>

  <!-- near ground -->
  <path fill="url(#hc-near)" d="M0 424 L110 404 L210 430 L300 412 L392 444 L470 470
        L470 520 L0 520 Z"/>

  <!-- the river: upland stream widening to an estuary at the coast -->
  <path fill="url(#hc-river)" opacity=".95"
        d="M497 318 C520 356 540 372 566 398 C596 428 612 452 636 470
           C664 492 700 502 742 508 L742 520 L688 520 C650 506 618 486 596 462
           C566 430 548 404 528 376 C512 352 500 334 489 320 Z"/>
  <path d="M497 318 C520 356 540 372 566 398 C596 428 612 452 636 470
           C664 492 700 502 742 508"
        fill="none" stroke="#e8f1f7" stroke-opacity=".55" stroke-width="1.4"/>

  <!-- the sea, right-hand third -->
  <path fill="url(#hc-sea)" d="M980 452 C1080 444 1180 452 1290 446 C1360 442 1410 446
        1440 444 L1440 520 L980 520 Z"/>
  <g stroke="#8fc1de" stroke-opacity=".5" stroke-width="1.6" fill="none"
     stroke-linecap="round">
    <path d="M1030 470 q22 -7 44 0 t44 0"/>
    <path d="M1150 486 q22 -7 44 0 t44 0"/>
    <path d="M1250 464 q22 -7 44 0 t44 0"/>
    <path d="M1070 500 q22 -7 44 0 t44 0"/>
  </g>

  <!-- a coastal town on the floodplain: the exposure this project is about -->
  <g fill="#f4f2ed" stroke="#0b3b2e" stroke-opacity=".22" stroke-width="1">
    <g transform="translate(770,436)">
      <rect x="0"  y="14" width="26" height="26"/><path d="M-3 14 L13 2 L29 14 Z"/>
      <rect x="34" y="6"  width="30" height="34"/><path d="M31 6 L49 -6 L67 6 Z"/>
      <rect x="72" y="18" width="24" height="22"/><path d="M69 18 L84 8 L99 18 Z"/>
      <rect x="104" y="10" width="28" height="30"/><path d="M101 10 L118 -2 L135 10 Z"/>
    </g>
    <g transform="translate(940,442)">
      <rect x="0"  y="12" width="28" height="26"/><path d="M-3 12 L14 0 L31 12 Z"/>
      <rect x="36" y="18" width="24" height="20"/><path d="M33 18 L48 8 L63 18 Z"/>
      <rect x="68" y="4"  width="26" height="34"/><path d="M65 4 L81 -8 L97 4 Z"/>
    </g>
  </g>
  <!-- a church spire, the usual landmark of an Irish coastal town -->
  <g transform="translate(886,404)" fill="#f4f2ed" stroke="#0b3b2e"
     stroke-opacity=".22" stroke-width="1">
    <rect x="0" y="20" width="16" height="52"/>
    <path d="M-4 20 L8 -6 L20 20 Z"/>
  </g>

  <!-- hedgerow trees, the near field boundary -->
  <g fill="#0b3b2e" opacity=".55">
    <g transform="translate(120,392)"><rect x="-1.5" y="6" width="3" height="16"/>
      <circle cx="0" cy="0" r="11"/></g>
    <g transform="translate(168,404)"><rect x="-1.5" y="5" width="3" height="14"/>
      <circle cx="0" cy="0" r="9"/></g>
    <g transform="translate(258,408)"><rect x="-1.5" y="6" width="3" height="16"/>
      <circle cx="0" cy="0" r="10"/></g>
    <g transform="translate(330,398)"><rect x="-1.5" y="6" width="3" height="16"/>
      <circle cx="0" cy="0" r="12"/></g>
  </g>

  <!-- the page fades into the section below rather than ending on a hard edge -->
  <rect x="0" y="392" width="1440" height="128" fill="url(#hc-fade)"/>
</svg>
